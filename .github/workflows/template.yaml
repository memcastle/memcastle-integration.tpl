name: Validate standalone integration template

on: [push, pull_request]

permissions:
  contents: read

jobs:
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install released GitTPL 0.14
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 0.14.0 --repo noirbizarre/git-tpl --pattern 'git-tpl_0.14.0_linux-amd64.tar.gz' --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/git-tpl_0.14.0_linux-amd64.tar.gz" -C "$RUNNER_TEMP" ./git-tpl
      - name: Check standalone and nested module rendering
        run: |
          "$RUNNER_TEMP/git-tpl" test
      - name: Check a standalone integration manifest and entry
        run: |
          "$RUNNER_TEMP/git-tpl" render . -o "$RUNNER_TEMP/standalone-integration" --answer module_name=standalone-integration --defaults
          python3 - "$RUNNER_TEMP/standalone-integration" <<'PY'
          import pathlib, sys, tomllib
          root = pathlib.Path(sys.argv[1])
          manifest = tomllib.loads((root / "memcastle-integration.toml").read_text())
          assert manifest["integration"]["id"] == "standalone-integration"
          assert any((root / asset["from"] / manifest["agent"]["entry"]).is_file()
                     for asset in manifest["assets"] if asset["to"] == ".")
          PY
      - name: Test the generated integration without Core source
        working-directory: ${{ runner.temp }}/standalone-integration
        run: npm run format:check && npm run lint && npm test && npm run build
